# Catálogo de casos de teste para as 13 famílias de `SecretKind` do `mt-db::sanitizer`.
# Contém >= 3 casos positivos e >= 2 casos negativos por família.

# =============================================================================
# 1. PemBlock
# =============================================================================
[[case]]
name = "pem_rsa_private_key"
kind = "PemBlock"
positive = true
input = "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MhgHcTz6sE2I2yPB\n-----END RSA PRIVATE KEY-----"
expected = "[REDACTED:PEM]"

[[case]]
name = "pem_openssh_private_key"
kind = "PemBlock"
positive = true
input = "Chave SSH:\n-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\n-----END OPENSSH PRIVATE KEY-----\nFim"
expected = "Chave SSH:\n[REDACTED:PEM]\nFim"

[[case]]
name = "pem_ec_private_key"
kind = "PemBlock"
positive = true
input = "-----BEGIN EC PRIVATE KEY-----\nMHcCAQEEII9b1fP5g2v3x4y5z6a7b8c9d0e1f2g3h4i5j6k7l8m9oAoGCCqGSM49\n-----END EC PRIVATE KEY-----"
expected = "[REDACTED:PEM]"

[[case]]
name = "pem_public_key_preserved"
kind = "PemBlock"
positive = false
input = "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xfn\n-----END PUBLIC KEY-----"
expected = "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xfn\n-----END PUBLIC KEY-----"

[[case]]
name = "pem_certificate_preserved"
kind = "PemBlock"
positive = false
input = "-----BEGIN CERTIFICATE-----\nMIIDXTCCAkWgAwIBAgIJALa8b9c0d1e2f3g4h5i6j7k8MA0GCSqGSIb3DQEBCwUA\n-----END CERTIFICATE-----"
expected = "-----BEGIN CERTIFICATE-----\nMIIDXTCCAkWgAwIBAgIJALa8b9c0d1e2f3g4h5i6j7k8MA0GCSqGSIb3DQEBCwUA\n-----END CERTIFICATE-----"


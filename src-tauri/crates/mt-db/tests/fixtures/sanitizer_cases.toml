# 2. JwtToken
# =============================================================================
[[case]]
name = "jwt_standard_hs256"
kind = "JwtToken"
positive = true
input = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvYW8ifQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
expected = "[REDACTED:JWT]"

[[case]]
name = "jwt_in_custom_header"
kind = "JwtToken"
positive = true
input = "curl https://api.example.com -H 'X-Session-Jwt: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhdXRoLm1heC5kZXYiLCJleHAiOjE5MDAwMDAwMDB9.signature_part_base64url_123456'"
expected = "curl https://api.example.com -H 'X-Session-Jwt: [REDACTED:JWT]'"

[[case]]
name = "jwt_eddsa_url_safe"
kind = "JwtToken"
positive = true
input = "eyJhbGciOiJFZERTQSIsImtpZCI6ImtleS0xIn0.eyJ1c2VyX2lkIjoiYWJjXzEyMy00NTYiLCJ0ZW5hbnQiOiJtYXgifQ.abCD1234_-efGH5678_-ijKL9012"
expected = "[REDACTED:JWT]"

[[case]]
name = "jwt_two_segments_only"
kind = "JwtToken"
positive = false
input = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0"
expected = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0"

[[case]]
name = "jwt_dotted_module_path"
kind = "JwtToken"
positive = false
input = "app.services.authentication.provider.v1"
expected = "app.services.authentication.provider.v1"

